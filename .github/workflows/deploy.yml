name: CI and production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PRs : on annule l’ancien run. Sur main : jamais, pour ne pas tuer un deploy SSH.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'DragonsGenerator.WEB/**'
              - 'DragonsGenerator.API/**'
              - 'DragonsGenerator.API.Tests/**'
              - 'scripts/**'
              - 'docker-compose*.yml'
              - '.github/**'

  test-api:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Restore API solution
        run: dotnet restore DragonsGenerator.API.sln
      - name: Validate class JSON data
        run: node scripts/validate-class-json.mjs
      - name: API tests
        run: >
          dotnet test DragonsGenerator.API.Tests/DragonsGenerator.API.Tests.csproj
          -c Release --no-restore

  test-web:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DragonsGenerator.WEB/package-lock.json
      - uses: browser-actions/setup-chrome@v2.2.0
      - name: Install WEB deps
        working-directory: DragonsGenerator.WEB
        run: npm ci
      - name: Angular tests
        working-directory: DragonsGenerator.WEB
        run: npm test
      - name: Angular lint
        working-directory: DragonsGenerator.WEB
        run: npm run lint

  e2e-forge:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: E2E forge / compte
        uses: ./.github/actions/e2e-run
        with:
          suite: forge
          report-name: ci-forge

  e2e-table:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: E2E table / session
        uses: ./.github/actions/e2e-run
        with:
          suite: table
          report-name: ci-table

  ci:
    name: CI
    needs: [changes, test-api, test-web, e2e-forge, e2e-table]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Gate
        env:
          APP: ${{ needs.changes.outputs.app }}
          API: ${{ needs.test-api.result }}
          WEB: ${{ needs.test-web.result }}
          FORGE: ${{ needs.e2e-forge.result }}
          TABLE: ${{ needs.e2e-table.result }}
        run: |
          set -euo pipefail
          if [ "$APP" != "true" ]; then
            echo "Pas de changement app — CI ok"
            exit 0
          fi
          echo "test-api=$API test-web=$WEB e2e-forge=$FORGE e2e-table=$TABLE"
          test "$API" = success
          test "$WEB" = success
          test "$FORGE" = success
          test "$TABLE" = success

  publish-images:
    needs: [changes, test-api, test-web]
    if: >
      needs.changes.outputs.app == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      count: ${{ steps.meta.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          count="$(git rev-list --count HEAD)"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: ./DragonsGenerator.API
          file: ./DragonsGenerator.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/dragons-api:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/dragons-api:1.${{ steps.meta.outputs.count }}
            ghcr.io/${{ steps.meta.outputs.owner }}/dragons-api:latest
          cache-from: type=gha,scope=dragons-api
          cache-to: type=gha,mode=min,scope=dragons-api
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: ./DragonsGenerator.WEB
          file: ./DragonsGenerator.WEB/Dockerfile
          push: true
          build-args: |
            APP_BUILD_COUNT=${{ steps.meta.outputs.count }}
            NGINX_CONF=nginx.conf
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/dragons-web:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/dragons-web:1.${{ steps.meta.outputs.count }}
            ghcr.io/${{ steps.meta.outputs.owner }}/dragons-web:latest
          cache-from: type=gha,scope=dragons-web
          cache-to: type=gha,mode=min,scope=dragons-web

  deploy:
    needs: [changes, test-api, test-web, e2e-forge, e2e-table, publish-images]
    if: >
      always() &&
      needs.changes.outputs.app == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.test-api.result == 'success' &&
      needs.test-web.result == 'success' &&
      needs.e2e-forge.result == 'success' &&
      needs.e2e-table.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DRAGONS_API_IMAGE: ghcr.io/${{ needs.publish-images.outputs.owner }}/dragons-api:${{ github.sha }}
          DRAGONS_WEB_IMAGE: ghcr.io/${{ needs.publish-images.outputs.owner }}/dragons-web:${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER,DRAGONS_API_IMAGE,DRAGONS_WEB_IMAGE
          script: |
            set -euo pipefail
            touch /tmp/dragons-deploy.lock
            trap 'rm -f /tmp/dragons-deploy.lock' EXIT
            cd ~/Dragons_Generator
            git fetch origin main
            git reset --hard origin/main
            export APP_BUILD_COUNT
            APP_BUILD_COUNT="$(git rev-list --count HEAD)"
            echo "App version v1.${APP_BUILD_COUNT}"

            ENV_FILE="$HOME/Dragons_Generator/.env"
            touch "$ENV_FILE"

            missing=0
            for key in Jwt__Key Admin__Email Admin__Password; do
              if ! grep -qE "^${key}=.+$" "$ENV_FILE"; then
                echo "ERROR: ${key} must be set in ${ENV_FILE}"
                missing=1
              fi
            done
            jwt_key=$(grep -E '^Jwt__Key=' "$ENV_FILE" | head -1 | cut -d= -f2- || true)
            if [ -z "$jwt_key" ] || [ "${#jwt_key}" -lt 32 ]; then
              echo "ERROR: Jwt__Key must be at least 32 characters"
              missing=1
            fi
            if [[ "$jwt_key" == CHANGE_ME* ]] || [ "$jwt_key" = "DragonsGenerator_Dev_Jwt_Key_ChangeInProd_32+" ]; then
              echo "ERROR: Jwt__Key must be a unique production secret"
              missing=1
            fi
            if grep -qE '^Admin__Password=(AdminDragons!2026|ChangeMeStrong!)$' "$ENV_FILE"; then
              echo "ERROR: Admin__Password must not be a default/example password"
              missing=1
            fi
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            chmod +x scripts/ensure-vapid-keys.sh
            ./scripts/ensure-vapid-keys.sh "$ENV_FILE"

            wait_for_docker_hub() {
              for i in $(seq 1 12); do
                if getent hosts auth.docker.io >/dev/null 2>&1; then
                  echo "Docker Hub DNS OK"
                  return 0
                fi
                echo "Waiting for Docker Hub DNS… ($i/12)"
                sleep 5
              done
              echo "WARN: Docker Hub DNS still flaky — retrying compose anyway"
            }

            compose_up() {
              local attempt=1
              local max=3
              while [ "$attempt" -le "$max" ]; do
                echo "docker compose up --build -d $* (attempt ${attempt}/${max})"
                wait_for_docker_hub
                if docker compose -f docker-compose.prod.yml up --build -d "$@"; then
                  return 0
                fi
                if [ "$attempt" -eq "$max" ]; then
                  return 1
                fi
                echo "WARN: compose failed (often transient DNS/registry) — retry in 30s"
                sleep 30
                attempt=$((attempt + 1))
              done
            }

            docker compose -f docker-compose.prod.yml stop ollama >/dev/null 2>&1 || true
            docker compose -f docker-compose.prod.yml rm -f ollama >/dev/null 2>&1 || true
            mkdir -p /var/www/certbot 2>/dev/null || sudo -n mkdir -p /var/www/certbot 2>/dev/null || true
            mkdir -p ~/backups/dragons
            chmod +x scripts/renew-letsencrypt.sh scripts/vps-watchdog.sh scripts/install-vps-cron.sh scripts/send-alert-email.sh scripts/backup-sqlite.sh scripts/send-backup-email.sh scripts/log-ops-event.sh
            ./scripts/renew-letsencrypt.sh docker-compose.prod.yml || echo "WARN: Let’s Encrypt renew skipped"
            ./scripts/install-vps-cron.sh || echo "WARN: cron watchdog non installé"
            if ! ls ~/backups/dragons/dragons-*.db >/dev/null 2>&1; then
              echo "Premier backup SQLite (aucun fichier encore)"
              ./scripts/backup-sqlite.sh || echo "WARN: premier backup échoué"
            fi
            docker image prune -f >/dev/null 2>&1 || true

            pulled=0
            if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${DRAGONS_API_IMAGE:-}" ] && [ -n "${DRAGONS_WEB_IMAGE:-}" ]; then
              echo "Pulling GHCR images"
              if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
                && docker pull "$DRAGONS_API_IMAGE" \
                && docker pull "$DRAGONS_WEB_IMAGE"; then
                export DRAGONS_API_IMAGE DRAGONS_WEB_IMAGE
                if docker compose -f docker-compose.prod.yml up -d --no-build --pull never --force-recreate dragons-api dragons-web autoheal; then
                  pulled=1
                fi
              else
                echo "WARN: GHCR pull/login failed — building on VPS"
              fi
              docker logout ghcr.io >/dev/null 2>&1 || true
            fi
            if [ "$pulled" -ne 1 ]; then
              unset DRAGONS_API_IMAGE DRAGONS_WEB_IMAGE || true
              compose_up dragons-api dragons-web autoheal
            fi

            for i in $(seq 1 60); do
              if docker compose -f docker-compose.prod.yml exec -T dragons-api curl -sf http://localhost:8080/health >/dev/null \
                && curl -sf http://127.0.0.1/api/health >/dev/null; then
                echo "Production health check OK after ${i} attempt(s)"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "ERROR: Production health check failed"
                chmod +x scripts/send-alert-email.sh 2>/dev/null || true
                ./scripts/send-alert-email.sh deploy \
                  "Dragons Generator — deploy health KO" \
                  "Le deploy production a fini mais /api/health ne répondait pas après 5 min. Logs API/web à vérifier sur le VPS." \
                  || true
                docker compose -f docker-compose.prod.yml logs dragons-api --tail 80
                docker compose -f docker-compose.prod.yml logs dragons-web --tail 40
                exit 1
              fi
              echo "Waiting for API health… ($i/60)"
              sleep 5
            done

            docker compose -f docker-compose.prod.yml ps
