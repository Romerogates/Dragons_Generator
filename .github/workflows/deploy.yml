name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DragonsGenerator.WEB/package-lock.json

      - name: Restore API solution
        run: dotnet restore DragonsGenerator.API.sln

      - name: Validate class JSON data
        run: node scripts/validate-class-json.mjs

      - name: API tests
        run: >
          dotnet test DragonsGenerator.API.Tests/DragonsGenerator.API.Tests.csproj
          -c Release --no-restore

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Angular tests
        working-directory: DragonsGenerator.WEB
        run: |
          npm ci
          npm test

      - name: Angular lint
        working-directory: DragonsGenerator.WEB
        run: |
          npm ci
          npm run lint

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DragonsGenerator.WEB/package-lock.json

      - name: Start local stack
        run: |
          docker compose -f docker-compose.local.yml up -d --build mailhog ollama
          chmod +x scripts/ensure-ollama-model.sh
          ./scripts/ensure-ollama-model.sh docker-compose.local.yml
          docker compose -f docker-compose.local.yml up -d --build dragons-api dragons-web
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/ >/dev/null \
              && curl -sf http://localhost:8081/api/health >/dev/null; then
              echo "Stack ready after ${i} attempt(s)"
              exit 0
            fi
            echo "Waiting for stack… ($i/60)"
            sleep 5
          done
          echo "Stack failed to become ready"
          docker compose -f docker-compose.local.yml logs
          exit 1

      - name: Playwright E2E (CI smoke)
        working-directory: DragonsGenerator.WEB
        env:
          E2E_BASE_URL: http://localhost:8081
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e:ci

      - name: Stop local stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ~/Dragons_Generator
            git fetch origin main
            git reset --hard origin/main

            ENV_FILE="$HOME/Dragons_Generator/.env"
            touch "$ENV_FILE"

            missing=0
            for key in Jwt__Key Admin__Email Admin__Password; do
              if ! grep -qE "^${key}=.+$" "$ENV_FILE"; then
                echo "ERROR: ${key} must be set in ${ENV_FILE}"
                missing=1
              fi
            done
            jwt_key=$(grep -E '^Jwt__Key=' "$ENV_FILE" | head -1 | cut -d= -f2- || true)
            if [ -z "$jwt_key" ] || [ "${#jwt_key}" -lt 32 ]; then
              echo "ERROR: Jwt__Key must be at least 32 characters"
              missing=1
            fi
            if [[ "$jwt_key" == CHANGE_ME* ]] || [ "$jwt_key" = "DragonsGenerator_Dev_Jwt_Key_ChangeInProd_32+" ]; then
              echo "ERROR: Jwt__Key must be a unique production secret"
              missing=1
            fi
            if grep -qE '^Admin__Password=(AdminDragons!2026|ChangeMeStrong!)$' "$ENV_FILE"; then
              echo "ERROR: Admin__Password must not be a default/example password"
              missing=1
            fi
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            chmod +x scripts/ensure-vapid-keys.sh
            ./scripts/ensure-vapid-keys.sh "$ENV_FILE"

            wait_for_docker_hub() {
              for i in $(seq 1 12); do
                if getent hosts auth.docker.io >/dev/null 2>&1; then
                  echo "Docker Hub DNS OK"
                  return 0
                fi
                echo "Waiting for Docker Hub DNS… ($i/12)"
                sleep 5
              done
              echo "WARN: Docker Hub DNS still flaky — retrying compose anyway"
            }

            compose_up() {
              local attempt=1
              local max=3
              while [ "$attempt" -le "$max" ]; do
                echo "docker compose up --build -d $* (attempt ${attempt}/${max})"
                wait_for_docker_hub
                if docker compose -f docker-compose.prod.yml up --build -d "$@"; then
                  return 0
                fi
                if [ "$attempt" -eq "$max" ]; then
                  return 1
                fi
                echo "WARN: compose failed (often transient DNS/registry) — retry in 30s"
                sleep 30
                attempt=$((attempt + 1))
              done
            }

            docker compose -f docker-compose.prod.yml up --build -d ollama || echo "WARN: Ollama container failed to start"
            chmod +x scripts/ensure-ollama-model.sh
            if ./scripts/ensure-ollama-model.sh docker-compose.prod.yml; then
              echo "Ollama model ready"
            else
              echo "WARN: Ollama model unavailable — API will fall back to Groq for short generations"
            fi
            compose_up dragons-api dragons-web

            for i in $(seq 1 30); do
              if curl -sf https://dragons-generator.top/api/health >/dev/null; then
                echo "Production health check OK after ${i} attempt(s)"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: Production health check failed"
                docker compose -f docker-compose.prod.yml logs dragons-api --tail 80
                exit 1
              fi
              echo "Waiting for API health… ($i/30)"
              sleep 5
            done

            docker compose -f docker-compose.prod.yml ps
