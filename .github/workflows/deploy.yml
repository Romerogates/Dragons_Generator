name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API solution
        run: dotnet restore DragonsGenerator.API.sln

      - name: API tests
        run: >
          dotnet test DragonsGenerator.API.Tests/DragonsGenerator.API.Tests.csproj
          -c Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DragonsGenerator.WEB/package-lock.json

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Angular tests
        working-directory: DragonsGenerator.WEB
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ~/Dragons_Generator
            git fetch origin main
            git reset --hard origin/main

            # Réinitialisation mot de passe admin (une seule fois — autres comptes / persos intacts)
            MARKER="$HOME/Dragons_Generator/.admin-password-reset-v2"
            ENV_FILE="$HOME/Dragons_Generator/.env"
            touch "$ENV_FILE"
            if [ ! -f "$MARKER" ]; then
              grep -q '^Admin__Email=' "$ENV_FILE" || echo 'Admin__Email=admin@dragons.local' >> "$ENV_FILE"
              grep -q '^Admin__Password=' "$ENV_FILE" || echo 'Admin__Password=AdminDragons!2026' >> "$ENV_FILE"
              sed -i '/^Admin__ResetPassword=/d' "$ENV_FILE"
              echo 'Admin__ResetPassword=true' >> "$ENV_FILE"
            fi

            docker compose -f docker-compose.prod.yml up --build -d

            if [ ! -f "$MARKER" ]; then
              sleep 8
              sed -i '/^Admin__ResetPassword=/d' "$ENV_FILE"
              docker compose -f docker-compose.prod.yml up -d dragons-api
              touch "$MARKER"
              echo "--- Comptes admin en base ---"
              docker logs dragons-api 2>&1 | grep -E "admin réinitialisé|Compte admin créé" | tail -5 || true
            fi

            docker compose -f docker-compose.prod.yml ps
