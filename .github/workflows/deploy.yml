name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ~/Dragons_Generator
            git fetch origin main
            git reset --hard origin/main

            # Réinitialisation mot de passe admin (une seule fois — autres comptes / persos intacts)
            MARKER="$HOME/Dragons_Generator/.admin-password-reset-v2"
            ENV_FILE="$HOME/Dragons_Generator/.env"
            touch "$ENV_FILE"
            if [ ! -f "$MARKER" ]; then
              grep -q '^Admin__Email=' "$ENV_FILE" || echo 'Admin__Email=admin@dragons.local' >> "$ENV_FILE"
              grep -q '^Admin__Password=' "$ENV_FILE" || echo 'Admin__Password=AdminDragons!2026' >> "$ENV_FILE"
              sed -i '/^Admin__ResetPassword=/d' "$ENV_FILE"
              echo 'Admin__ResetPassword=true' >> "$ENV_FILE"
            fi

            docker compose -f docker-compose.prod.yml up --build -d

            if [ ! -f "$MARKER" ]; then
              sleep 8
              sed -i '/^Admin__ResetPassword=/d' "$ENV_FILE"
              docker compose -f docker-compose.prod.yml up -d dragons-api
              touch "$MARKER"
              echo "--- Comptes admin en base ---"
              docker logs dragons-api 2>&1 | grep -E "admin réinitialisé|Compte admin créé" | tail -5 || true
            fi

            docker compose -f docker-compose.prod.yml ps
