name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DragonsGenerator.WEB/package-lock.json

      - name: Restore API solution
        run: dotnet restore DragonsGenerator.API.sln

      - name: Validate class JSON data
        run: node scripts/validate-class-json.mjs

      - name: API tests
        run: >
          dotnet test DragonsGenerator.API.Tests/DragonsGenerator.API.Tests.csproj
          -c Release --no-restore

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install WEB deps
        working-directory: DragonsGenerator.WEB
        run: npm ci

      - name: Angular tests
        working-directory: DragonsGenerator.WEB
        run: npm test

      - name: Angular lint
        working-directory: DragonsGenerator.WEB
        run: npm run lint

  # Runs in parallel with `test` — deploy still gates on both.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DragonsGenerator.WEB/package-lock.json

      # One ECR pull only: a second anonymous public.ecr.aws pull 429s on GitHub IPs.
      # Stubs + Dockerfile.e2e reuse node:24-alpine (nginx comes from Alpine apk).
      - name: Prefetch web base images
        run: |
          set -euo pipefail
          src=public.ecr.aws/docker/library/node:24-alpine
          echo "prefetch $src -> node:24-alpine"
          attempt=1
          max=5
          while [ "$attempt" -le "$max" ]; do
            if docker pull "$src"; then
              docker tag "$src" node:24-alpine
              exit 0
            fi
            echo "WARN: pull failed (attempt ${attempt}/${max}) — retry"
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
          exit 1

      - name: Start local stack
        run: |
          export APP_BUILD_COUNT
          APP_BUILD_COUNT="$(git rev-list --count HEAD)"
          compose() {
            docker compose -f docker-compose.local.yml -f docker-compose.e2e.yml "$@"
          }
          compose up -d --pull never mailhog ollama
          compose up -d --build --pull never dragons-api dragons-web
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/ >/dev/null \
              && curl -sf http://localhost:8081/api/health >/dev/null; then
              echo "Stack ready after ${i} attempt(s)"
              exit 0
            fi
            echo "Waiting for stack… ($i/60)"
            sleep 5
          done
          echo "Stack failed to become ready"
          docker compose -f docker-compose.local.yml -f docker-compose.e2e.yml logs
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('DragonsGenerator.WEB/package-lock.json') }}

      - name: Playwright E2E (CI smoke)
        working-directory: DragonsGenerator.WEB
        env:
          E2E_BASE_URL: http://localhost:8081
          CI: 'true'
        run: |
          npm ci
          # ubuntu-latest ships Google Chrome apt sources that flake with
          # "Hash Sum mismatch" during `playwright install --with-deps`.
          # Playwright bundles its own Chromium; that repo is unused.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
            /etc/apt/sources.list.d/google-chrome*.sources 2>/dev/null || true
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
          npm run e2e:ci

      - name: Stop local stack
        if: always()
        run: docker compose -f docker-compose.local.yml -f docker-compose.e2e.yml down -v

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            touch /tmp/dragons-deploy.lock
            trap 'rm -f /tmp/dragons-deploy.lock' EXIT
            cd ~/Dragons_Generator
            git fetch origin main
            git reset --hard origin/main
            export APP_BUILD_COUNT
            APP_BUILD_COUNT="$(git rev-list --count HEAD)"
            echo "App version v1.${APP_BUILD_COUNT}"

            ENV_FILE="$HOME/Dragons_Generator/.env"
            touch "$ENV_FILE"

            missing=0
            for key in Jwt__Key Admin__Email Admin__Password; do
              if ! grep -qE "^${key}=.+$" "$ENV_FILE"; then
                echo "ERROR: ${key} must be set in ${ENV_FILE}"
                missing=1
              fi
            done
            jwt_key=$(grep -E '^Jwt__Key=' "$ENV_FILE" | head -1 | cut -d= -f2- || true)
            if [ -z "$jwt_key" ] || [ "${#jwt_key}" -lt 32 ]; then
              echo "ERROR: Jwt__Key must be at least 32 characters"
              missing=1
            fi
            if [[ "$jwt_key" == CHANGE_ME* ]] || [ "$jwt_key" = "DragonsGenerator_Dev_Jwt_Key_ChangeInProd_32+" ]; then
              echo "ERROR: Jwt__Key must be a unique production secret"
              missing=1
            fi
            if grep -qE '^Admin__Password=(AdminDragons!2026|ChangeMeStrong!)$' "$ENV_FILE"; then
              echo "ERROR: Admin__Password must not be a default/example password"
              missing=1
            fi
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            chmod +x scripts/ensure-vapid-keys.sh
            ./scripts/ensure-vapid-keys.sh "$ENV_FILE"

            wait_for_docker_hub() {
              for i in $(seq 1 12); do
                if getent hosts auth.docker.io >/dev/null 2>&1; then
                  echo "Docker Hub DNS OK"
                  return 0
                fi
                echo "Waiting for Docker Hub DNS… ($i/12)"
                sleep 5
              done
              echo "WARN: Docker Hub DNS still flaky — retrying compose anyway"
            }

            compose_up() {
              local attempt=1
              local max=3
              while [ "$attempt" -le "$max" ]; do
                echo "docker compose up --build -d $* (attempt ${attempt}/${max})"
                wait_for_docker_hub
                if docker compose -f docker-compose.prod.yml up --build -d "$@"; then
                  return 0
                fi
                if [ "$attempt" -eq "$max" ]; then
                  return 1
                fi
                echo "WARN: compose failed (often transient DNS/registry) — retry in 30s"
                sleep 30
                attempt=$((attempt + 1))
              done
            }

            docker compose -f docker-compose.prod.yml stop ollama >/dev/null 2>&1 || true
            echo "Ollama stopped on this VPS — Groq handles generation so the site stays up"
            mkdir -p /var/www/certbot 2>/dev/null || sudo -n mkdir -p /var/www/certbot 2>/dev/null || true
            mkdir -p ~/backups/dragons
            chmod +x scripts/renew-letsencrypt.sh scripts/vps-watchdog.sh scripts/install-vps-cron.sh scripts/send-alert-email.sh scripts/backup-sqlite.sh scripts/send-backup-email.sh scripts/log-ops-event.sh
            ./scripts/renew-letsencrypt.sh docker-compose.prod.yml || echo "WARN: Let’s Encrypt renew skipped"
            ./scripts/install-vps-cron.sh || echo "WARN: cron watchdog non installé"
            if ! ls ~/backups/dragons/dragons-*.db >/dev/null 2>&1; then
              echo "Premier backup SQLite (aucun fichier encore)"
              ./scripts/backup-sqlite.sh || echo "WARN: premier backup échoué"
            fi
            docker image prune -f >/dev/null 2>&1 || true
            compose_up dragons-api dragons-web autoheal

            for i in $(seq 1 60); do
              if docker compose -f docker-compose.prod.yml exec -T dragons-api curl -sf http://localhost:8080/health >/dev/null \
                && curl -sf http://127.0.0.1/api/health >/dev/null; then
                echo "Production health check OK after ${i} attempt(s)"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "ERROR: Production health check failed"
                chmod +x scripts/send-alert-email.sh 2>/dev/null || true
                ./scripts/send-alert-email.sh deploy \
                  "Dragons Generator — deploy health KO" \
                  "Le deploy production a fini mais /api/health ne répondait pas après 5 min. Logs API/web à vérifier sur le VPS." \
                  || true
                docker compose -f docker-compose.prod.yml logs dragons-api --tail 80
                docker compose -f docker-compose.prod.yml logs dragons-web --tail 40
                exit 1
              fi
              echo "Waiting for API health… ($i/60)"
              sleep 5
            done

            docker compose -f docker-compose.prod.yml ps
