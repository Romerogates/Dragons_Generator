<div class="min-h-screen bg-[#171b22] text-slate-200 font-sans antialiased flex flex-col overflow-x-clip">
  @if (!isOnline()) {
    <div
      class="sticky top-0 z-[60] bg-amber-950/95 border-b border-amber-800/60 text-amber-100 text-center text-xs sm:text-sm px-3 py-2"
      role="status"
    >
      Hors ligne
      @if (pendingSyncCount() > 0) {
        <span class="text-amber-300/80"> · {{ pendingSyncCount() }} en attente de sync</span>
      }
      <span class="text-amber-200/70"> · Codex et brouillons restent disponibles</span>
    </div>
  }

  @if (updateReady()) {
    <div
      class="sticky top-0 z-[60] bg-sky-950/95 border-b border-sky-800/60 text-sky-100 flex flex-wrap items-center justify-center gap-3 text-xs sm:text-sm px-3 py-2"
      role="status"
    >
      <span>Nouvelle version disponible</span>
      <button
        type="button"
        class="px-3 py-1 rounded-lg font-black uppercase tracking-widest text-[10px] bg-sky-600 text-white hover:bg-sky-500"
        (click)="applyUpdate()"
      >
        Recharger
      </button>
      <button
        type="button"
        class="px-2 py-1 text-[10px] uppercase tracking-widest text-sky-400/80 hover:text-sky-200"
        (click)="dismissUpdate()"
      >
        Plus tard
      </button>
    </div>
  }

  <app-navbar />

  <main class="flex-grow relative min-w-0 overflow-x-clip">
    <router-outlet />
  </main>

  <app-site-footer />

  <app-context-menu />
  <app-ai-rate-limit-dialog />
  <app-friend-chat-dock />
</div>
