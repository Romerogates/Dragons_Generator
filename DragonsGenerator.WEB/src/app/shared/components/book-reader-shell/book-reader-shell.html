<div
  class="book-shell fixed inset-0 z-[85] flex flex-col text-[#2a1c14] animate-fade-in"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title()"
>
  <header
    class="book-shell__bar shrink-0 sticky top-0 z-20 flex flex-wrap items-center gap-2 px-3 py-2.5"
  >
    <a
      [routerLink]="backLink()"
      class="min-h-11 inline-flex items-center rounded-xl border border-[#c4a574]/40 bg-[#2a1c14]/80 px-3 text-[10px] font-black uppercase tracking-widest text-[#e8d4a8] hover:bg-[#3d2a1f]"
    >
      ← {{ backLabel() }}
    </a>
    <div class="min-w-0 flex-1 text-center px-2">
      <p class="text-[10px] font-black uppercase tracking-widest text-[#c4a574]/90">
        Mode Livre · Échap
      </p>
      <p class="text-sm font-serif font-bold truncate text-[#f3e6c8]">{{ title() }}</p>
      @if (subtitle()) {
        <p class="text-[11px] text-[#c4a574] truncate">{{ subtitle() }}</p>
      }
    </div>
    <span class="min-w-11 w-11" aria-hidden="true"></span>
  </header>

  <div class="flex-1 min-h-0 flex flex-col lg:flex-row">
    @if (showToc() && toc().length) {
      <aside
        class="book-shell__toc shrink-0 lg:w-64 xl:w-72 border-b lg:border-b-0 lg:border-r border-[#c4a574]/40 overflow-y-auto max-h-[40vh] lg:max-h-none"
      >
        <p class="px-4 pt-4 pb-2 text-[10px] font-black uppercase tracking-widest text-[#8a6a4a]">
          Sommaire
        </p>
        <nav class="px-2 pb-4 space-y-0.5" aria-label="Sommaire du livre">
          @for (item of toc(); track item.id) {
            <button
              type="button"
              class="w-full text-left rounded-lg px-3 py-2.5 transition-colors"
              [class]="
                item.id === activeId()
                  ? 'bg-[#5c4030] text-[#f3e6c8]'
                  : 'text-[#3d2a1f] hover:bg-[#e8d4a8]/60'
              "
              (click)="selectItem.emit(item.id)"
            >
              <span class="block text-sm font-serif font-semibold leading-snug">{{
                item.label
              }}</span>
              @if (item.subtitle) {
                <span class="block text-[10px] opacity-70 mt-0.5">{{ item.subtitle }}</span>
              }
            </button>
          }
        </nav>
      </aside>
    }

    <div class="flex-1 min-h-0 overflow-y-auto overscroll-contain book-shell__pages">
      <div class="book-shell__page mx-auto my-4 sm:my-8 px-4 sm:px-8 py-8 sm:py-10 max-w-3xl">
        <ng-content />
      </div>
    </div>
  </div>
</div>
