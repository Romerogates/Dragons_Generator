<div
  class="book-shell fixed inset-0 z-[85] flex flex-col bg-[#0a0d13] text-slate-300 animate-fade-in"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title()"
>
  <header
    class="shrink-0 sticky top-0 z-20 flex flex-wrap items-center gap-2 border-b border-slate-800/80 bg-[#12161c]/95 px-3 py-2.5 backdrop-blur-sm"
  >
    <a
      [routerLink]="backLink()"
      class="min-h-11 inline-flex items-center rounded-xl border border-slate-700 px-3 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-slate-200"
    >
      ← {{ backLabel() }}
    </a>
    <div class="min-w-0 flex-1 text-center px-2">
      <p class="text-[10px] font-black uppercase tracking-widest text-slate-500">
        Codex · Échap
      </p>
      <p class="text-sm font-serif font-bold truncate text-slate-100">{{ title() }}</p>
      @if (subtitle()) {
        <p class="text-[11px] text-slate-500 truncate">{{ subtitle() }}</p>
      }
    </div>
    <span class="min-w-11 w-11" aria-hidden="true"></span>
  </header>

  <div class="flex-1 min-h-0 flex flex-col lg:flex-row">
    @if (showToc() && toc().length) {
      <aside
        class="shrink-0 lg:w-64 xl:w-72 border-b lg:border-b-0 lg:border-r border-slate-800 bg-[#12161c] overflow-y-auto max-h-[40vh] lg:max-h-none"
      >
        <p class="px-4 pt-4 pb-2 text-[10px] font-black uppercase tracking-widest text-slate-500">
          Sommaire
        </p>
        <nav class="px-2 pb-4 space-y-0.5" aria-label="Sommaire">
          @for (item of toc(); track item.id) {
            <button
              type="button"
              class="w-full text-left rounded-lg px-3 py-2.5 transition-colors"
              [class]="
                item.id === activeId()
                  ? 'bg-red-950/40 text-red-200 border border-red-900/40'
                  : 'text-slate-300 hover:bg-slate-800/60 border border-transparent'
              "
              (click)="selectItem.emit(item.id)"
            >
              <span class="block text-sm font-serif font-semibold leading-snug">{{
                item.label
              }}</span>
              @if (item.subtitle) {
                <span class="block text-[10px] text-slate-500 mt-0.5">{{ item.subtitle }}</span>
              }
            </button>
          }
        </nav>
      </aside>
    }

    <div class="flex-1 min-h-0 overflow-y-auto overscroll-contain">
      <div class="max-w-5xl mx-auto px-4 py-8 pb-24">
        <ng-content />
      </div>
    </div>
  </div>
</div>
