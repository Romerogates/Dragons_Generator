<div class="flex flex-col gap-3 w-full">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <p class="text-[10px] font-black uppercase tracking-widest text-slate-500">
      Région d'Eana
    </p>
    @if (selectedRegion(); as region) {
      <span
        class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border"
        [class]="
          region.kind === 'unknown'
            ? 'bg-slate-900 text-slate-400 border-slate-700'
            : 'bg-violet-950/40 text-violet-300 border-violet-800/50'
        "
      >
        {{ regionLabel() }}
      </span>
    } @else {
      <span class="text-[10px] text-slate-600 italic">Choisissez une région sur la carte</span>
    }
  </div>

  @if (loading()) {
    <div class="flex justify-center py-16 bg-[#171b22] border border-slate-700 rounded-xl">
      <div
        class="w-8 h-8 border-4 border-violet-500/30 border-t-violet-500 rounded-full animate-spin"
      ></div>
    </div>
  } @else if (error(); as err) {
    <div class="p-4 bg-red-950/40 border border-red-900/50 rounded-xl text-sm text-red-300">
      {{ err }}
    </div>
  } @else {
    <div
      #mapViewport
      class="eana-map-viewport relative w-full min-h-[240px] sm:min-h-[320px] max-h-[min(50vh,420px)] bg-[#171b22] border-2 border-slate-700 rounded-xl shadow-inner overflow-hidden touch-none cursor-grab"
      [class.cursor-grabbing]="isPanning()"
      (wheel)="onWheel($event)"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerUp($event)"
    >
      <div
        class="absolute left-0 top-0 origin-top-left will-change-transform"
        [class.opacity-0]="!mapReady()"
        [style.width.px]="mapWidth()"
        [style.height.px]="mapHeight()"
        [style.transform]="mapTransform()"
      >
        <img
          src="Carte.jpg"
          alt="Carte d'Eana"
          class="absolute inset-0 w-full h-full object-fill opacity-85 pointer-events-none select-none"
          draggable="false"
        />

        @for (civ of civilizations(); track civ.id) {
          <div
            data-map-pin
            class="absolute z-10"
            [style.top.%]="getMapCoordinates(civ.id).y"
            [style.left.%]="getMapCoordinates(civ.id).x"
            [style.transform]="'translate(-50%, -50%) scale(' + pinCounterScale() + ')'"
          >
            <button
              type="button"
              class="relative w-10 h-10 flex items-center justify-center rounded-full text-base shadow-sm transition-transform hover:scale-[1.05]"
              [class]="
                isSelectedCiv(civ.id)
                  ? 'bg-violet-600 border-2 border-violet-300 text-white'
                  : 'bg-[#1b2028]/95 border-2 border-amber-500/70 text-lg hover:border-amber-400'
              "
              (click)="pickCivilization(civ, $event)"
              [attr.aria-label]="civ.name"
              [attr.aria-pressed]="isSelectedCiv(civ.id)"
            >
              <iconify-icon [icon]="getIconForCiv(civ.id)"></iconify-icon>
            </button>
          </div>
        }
      </div>

      <div class="absolute bottom-3 right-3 z-30 flex flex-col gap-1.5" (pointerdown)="$event.stopPropagation()">
        <button
          type="button"
          class="w-9 h-9 rounded-lg bg-[#1b2028]/95 border border-slate-600 text-violet-400 text-lg font-black disabled:opacity-30"
          [disabled]="!canZoomIn()"
          (click)="zoomIn()"
          aria-label="Zoomer"
        >
          +
        </button>
        <button
          type="button"
          class="w-9 h-9 rounded-lg bg-[#1b2028]/95 border border-slate-600 text-violet-400 text-lg font-black disabled:opacity-30"
          [disabled]="!canZoomOut()"
          (click)="zoomOut()"
          aria-label="Dézoomer"
        >
          −
        </button>
        <button
          type="button"
          class="w-9 h-9 rounded-lg bg-[#1b2028]/95 border border-slate-600 text-slate-400 text-[10px] font-black"
          (click)="resetView()"
          aria-label="Recentrer"
        >
          ◎
        </button>
      </div>
    </div>
  }

  <button
    type="button"
    class="w-full py-3 rounded-xl text-[10px] font-black uppercase tracking-widest border transition-colors"
    [class]="
      isUnknownSelected()
        ? 'bg-slate-800 text-slate-200 border-slate-600'
        : 'bg-[#1b2028] text-slate-400 border-slate-700 hover:border-slate-500 hover:text-slate-300'
    "
    (click)="pickUnknown()"
  >
    Région inconnue
  </button>
</div>
