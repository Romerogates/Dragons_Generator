<div class="eana-map-picker relative w-full">
  @if (loading()) {
    <div class="flex justify-center items-center eana-map-stage bg-[#171b22]">
      <div
        class="w-8 h-8 border-4 border-violet-500/30 border-t-violet-500 rounded-full animate-spin"
      ></div>
    </div>
  } @else if (error(); as err) {
    <div class="mx-4 my-6 p-4 bg-red-950/40 border border-red-900/50 rounded-xl text-sm text-red-300">
      {{ err }}
    </div>
  } @else {
    <div
      class="bg-[#171b22] space-y-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]"
      data-map-ui
      (pointerdown)="$event.stopPropagation()"
    >
      <!-- Pills — moitié haute -->
      <div class="flex flex-wrap justify-center gap-2 px-3 pt-2">
        @for (civ of civilizationsTop(); track civ.id) {
          <button
            type="button"
            class="inline-flex items-center gap-1.5 min-h-10 px-2.5 py-1.5 rounded-full text-[11px] font-bold tracking-wide border transition-colors"
            [class]="
              isSelectedCiv(civ.id)
                ? 'bg-violet-600 text-white border-violet-400'
                : 'bg-[#1b2028] text-slate-200 border-slate-600/80 active:bg-slate-800'
            "
            (click)="pickCivilizationFromList(civ)"
          >
            <iconify-icon class="text-sm shrink-0" [icon]="getIconForCiv(civ.id)"></iconify-icon>
            <span>{{ civ.name }}</span>
          </button>
        }
      </div>

      <div
        #mapViewport
        class="eana-map-viewport eana-map-stage relative bg-[#171b22] overflow-hidden cursor-grab select-none"
        [class.cursor-grabbing]="isPanning()"
        (wheel)="onWheel($event)"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp($event)"
        (pointercancel)="onPointerUp($event)"
      >
        <div
          class="absolute left-0 top-0 origin-top-left will-change-transform"
          [class.opacity-0]="!mapReady()"
          [style.width.px]="mapWidth()"
          [style.height.px]="mapHeight()"
          [style.transform]="mapTransform()"
        >
          <img
            src="Carte.jpg"
            alt="Carte d'Eana"
            class="absolute inset-0 w-full h-full object-fill opacity-90 pointer-events-none select-none"
            draggable="false"
          />

          @for (civ of civilizations(); track civ.id) {
            <div
              data-map-pin
              class="absolute z-10"
              [style.top.%]="getMapCoordinates(civ.id).y"
              [style.left.%]="getMapCoordinates(civ.id).x"
              [style.transform]="'translate(-50%, -50%) scale(' + pinCounterScale() + ')'"
            >
              <button
                type="button"
                class="relative min-w-11 min-h-11 w-11 h-11 flex items-center justify-center rounded-full text-base shadow-sm transition-transform active:scale-[1.04]"
                [class]="
                  isSelectedCiv(civ.id)
                    ? 'bg-violet-600 border-2 border-violet-300 text-white'
                    : 'bg-[#1b2028]/95 border-2 border-amber-500/70 text-lg hover:border-amber-400'
                "
                (pointerdown)="onPinPointerDown($event)"
                (pointerup)="onPinPointerUp(civ, $event)"
                (click)="$event.preventDefault(); $event.stopPropagation()"
                [attr.aria-label]="civ.name"
                [attr.aria-pressed]="isSelectedCiv(civ.id)"
              >
                <iconify-icon [icon]="getIconForCiv(civ.id)"></iconify-icon>
              </button>
              @if (isSelectedCiv(civ.id)) {
                <span
                  class="absolute left-1/2 -translate-x-1/2 top-full mt-1 whitespace-nowrap px-2 py-0.5 rounded bg-[#020617]/90 border border-violet-700/40 text-[10px] font-bold uppercase tracking-wider text-violet-200 pointer-events-none shadow-lg"
                >
                  {{ civ.name }}
                </span>
              }
            </div>
          }
        </div>

        <div
          class="pointer-events-none absolute inset-x-0 top-0 h-5 z-20 bg-gradient-to-b from-[#171b22]/80 to-transparent"
        ></div>
        <div
          class="pointer-events-none absolute inset-x-0 bottom-0 h-5 z-20 bg-gradient-to-t from-[#171b22]/80 to-transparent"
        ></div>
      </div>

      <div class="flex items-center gap-2 px-3">
        <p class="flex-1 min-w-0 text-sm text-slate-300 truncate" data-testid="eana-region-status">
          {{ regionStatusLabel() }}
        </p>
        <div class="flex items-center gap-1 shrink-0">
          <button
            type="button"
            class="min-w-11 min-h-11 inline-flex items-center justify-center rounded-xl bg-[#1b2028] border border-slate-600/80 text-violet-300 disabled:opacity-30"
            [disabled]="!canZoomOut()"
            (click)="zoomOut()"
            aria-label="Dézoomer"
          >
            <iconify-icon icon="fluent:subtract-24-regular" class="text-xl"></iconify-icon>
          </button>
          <button
            type="button"
            class="min-w-11 min-h-11 inline-flex items-center justify-center rounded-xl bg-[#1b2028] border border-slate-600/80 text-violet-300 disabled:opacity-30"
            [disabled]="!canZoomIn()"
            (click)="zoomIn()"
            aria-label="Zoomer"
          >
            <iconify-icon icon="fluent:add-24-regular" class="text-xl"></iconify-icon>
          </button>
          <button
            type="button"
            class="min-w-11 min-h-11 inline-flex items-center justify-center rounded-xl bg-[#1b2028] border border-slate-600/80 text-slate-300"
            (click)="resetView()"
            aria-label="Recentrer"
          >
            <iconify-icon icon="fluent:arrow-reset-24-regular" class="text-xl"></iconify-icon>
          </button>
        </div>
      </div>

      <!-- Pills — moitié basse + région inconnue -->
      <div class="flex flex-wrap justify-center gap-2 px-3">
        @for (civ of civilizationsBottom(); track civ.id) {
          <button
            type="button"
            class="inline-flex items-center gap-1.5 min-h-10 px-2.5 py-1.5 rounded-full text-[11px] font-bold tracking-wide border transition-colors"
            [class]="
              isSelectedCiv(civ.id)
                ? 'bg-violet-600 text-white border-violet-400'
                : 'bg-[#1b2028] text-slate-200 border-slate-600/80 active:bg-slate-800'
            "
            (click)="pickCivilizationFromList(civ)"
          >
            <iconify-icon class="text-sm shrink-0" [icon]="getIconForCiv(civ.id)"></iconify-icon>
            <span>{{ civ.name }}</span>
          </button>
        }
        <button
          type="button"
          class="inline-flex items-center gap-1.5 min-h-10 px-2.5 py-1.5 rounded-full text-[11px] font-bold tracking-wide border transition-colors"
          [class]="
            isUnknownSelected()
              ? 'bg-slate-600 text-white border-slate-400'
              : 'bg-[#1b2028] text-slate-300 border-slate-600/80 active:bg-slate-800'
          "
          (click)="pickUnknown()"
        >
          <iconify-icon class="text-sm shrink-0" icon="fluent:question-circle-24-regular"></iconify-icon>
          <span>Région inconnue</span>
        </button>
      </div>
    </div>
  }
</div>
