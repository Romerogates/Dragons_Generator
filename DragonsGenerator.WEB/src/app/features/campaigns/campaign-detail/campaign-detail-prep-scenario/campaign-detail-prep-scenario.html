@if (isOwner()) {
  <div class="space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-[#1b2028]/60 px-4 py-3">
      <p class="text-xs text-slate-500">
        Titre, synopsis, région et ton — les rencontres et notes sont conservées.
      </p>
      <button
        type="button"
        class="shrink-0 px-3 py-2 rounded-xl text-[10px] font-black uppercase border border-violet-800/50 text-violet-300 hover:border-violet-500/50 hover:bg-violet-950/30 transition-colors"
        (click)="editScenario.emit()"
      >
        Modifier le scénario
      </button>
    </div>
    <input
      type="text"
      class="w-full bg-[#1b2028] border border-slate-700 rounded-xl py-3 px-4 text-lg font-serif text-violet-300"
      [ngModel]="title()"
      (ngModelChange)="titleChange.emit($event)"
    />
    <div class="bg-[#1b2028] border border-slate-800 rounded-2xl p-5 md:p-6">
      <h2 class="text-[10px] font-black uppercase tracking-widest text-violet-500 mb-5">Synopsis</h2>
      @if (adventure().trim()) {
        <app-adventure-synopsis-view [text]="adventure()" />
      } @else {
        <div class="rounded-xl border border-dashed border-violet-800/50 bg-violet-950/15 p-6 text-center space-y-4">
          <p class="text-sm text-slate-300">Aucun synopsis pour l’instant.</p>
          <p class="text-xs text-slate-500">Écrivez ou générez l’aventure pour lancer la table.</p>
          <button
            type="button"
            class="px-4 py-2.5 rounded-xl text-[10px] font-black uppercase bg-violet-600 text-white hover:bg-violet-500"
            (click)="editScenario.emit()"
          >
            Écrire / générer le synopsis
          </button>
        </div>
      }
    </div>
  </div>
} @else {
  <p class="text-slate-500 italic text-center py-12">Réservé au MJ.</p>
}
