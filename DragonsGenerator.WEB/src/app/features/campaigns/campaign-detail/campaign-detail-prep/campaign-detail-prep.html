<section class="space-y-5 min-h-[100dvh]">
  @if (isMj()) {
    <app-campaign-setup-guide [state]="guideState()" (action)="guideAction.emit($event)" />

    @if (dossierTiles().length) {
      <div class="space-y-3" data-testid="prep-dossier">
        <div>
          <p class="text-[10px] font-black uppercase tracking-[0.18em] text-slate-500">Dossier de soirée</p>
          <h3 class="mt-1 font-serif text-lg text-slate-100">Ce qui est prêt</h3>
        </div>
        <div class="grid grid-cols-2 gap-2 sm:gap-3">
          @for (tile of dossierTiles(); track tile.id) {
            <app-play-dock-tile
              [title]="tile.title"
              [detail]="tile.detail"
              [tone]="tile.tone"
              [testId]="'prep-tile-' + tile.id"
              (pressed)="prepSubChange.emit(tile.id)"
            />
          }
        </div>
      </div>
    }
  }

  <nav data-prep-subnav class="flex flex-nowrap gap-1.5 overflow-x-auto overscroll-x-contain pb-1 -mx-1 px-1" aria-label="Préparation">
    @for (s of tabs(); track s.id) {
      <button
        type="button"
        class="inline-flex shrink-0 items-center gap-1.5 min-h-11 px-3 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest border transition-colors"
        [class]="
          prepSub() === s.id
            ? 'border-violet-500 text-violet-300 bg-violet-950/30'
            : 'border-slate-700 text-slate-500'
        "
        (click)="prepSubChange.emit(s.id)"
      >
        <iconify-icon
          noobserver
          [icon]="s.icon"
          width="14"
          height="14"
          class="inline-block shrink-0"
        ></iconify-icon>
        <span>{{ s.label }}</span>
      </button>
    }
  </nav>

  <ng-content />
</section>
