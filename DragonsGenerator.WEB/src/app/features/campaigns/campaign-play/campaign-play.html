<div class="min-h-screen bg-[#0a0d13] text-slate-300 flex flex-col">
  @if (loading()) {
    <p class="text-center py-24 text-emerald-400 animate-pulse">Chargement de la table…</p>
  } @else if (error(); as err) {
    <div class="max-w-lg mx-auto px-4 py-24 text-center">
      <p class="text-red-400 mb-4">{{ err }}</p>
      <a routerLink="/campaigns" class="text-violet-400 text-sm">← Retour aux campagnes</a>
    </div>
  } @else if (campaign(); as c) {
    <header
      class="sticky top-0 z-30 border-b border-emerald-900/40 bg-[#171b22]/95 backdrop-blur-md px-4 py-3"
    >
      <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
        <a
          [routerLink]="['/campaigns', c.id]"
          class="inline-flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-emerald-400 transition-colors group"
        >
          <span class="group-hover:-translate-x-1 transition-transform">←</span> Campagne
        </a>
        <div class="text-center flex-1 min-w-0 px-2">
          <p class="text-[10px] font-black uppercase tracking-widest text-emerald-500">Table de jeu</p>
          <h1 class="text-lg md:text-xl font-serif text-emerald-200 truncate">{{ c.title }}</h1>
        </div>
        <span class="text-[10px] font-black uppercase tracking-widest text-slate-600 w-20 text-right"
          >MJ</span
        >
      </div>
    </header>

    <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-6 md:py-8">
      <app-campaign-play-panel
        [campaign]="c"
        [fullscreen]="true"
        (campaignChange)="onCampaignChange($event)"
      />
    </main>
  }
</div>
