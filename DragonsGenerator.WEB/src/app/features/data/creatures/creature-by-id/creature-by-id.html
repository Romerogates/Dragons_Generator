<app-book-reader-shell
  [title]="creature()?.name ?? 'Créature'"
  [subtitle]="creature()?.type ?? null"
  backLink="/creatures"
  backLabel="Bestiaire"
>
  @if (creature() === undefined) {
    <div class="flex flex-col items-center justify-center py-24 text-[#5c4030]">
      <p class="text-sm font-serif tracking-widest uppercase animate-pulse">
        Ouverture du livre…
      </p>
    </div>
  } @else if (notFound()) {
    <div class="text-center py-16">
      <h2 class="text-2xl font-serif font-bold text-[#5c4030] mb-4">Créature introuvable</h2>
      <a
        routerLink="/creatures"
        class="inline-flex min-h-11 items-center rounded-xl border border-[#c4a574]/60 px-4 text-[10px] font-black uppercase tracking-widest text-[#5c4030]"
      >
        Retour au bestiaire
      </a>
    </div>
  } @else if (error(); as errorMsg) {
    <p class="text-center text-sm text-red-800 py-12">{{ errorMsg }}</p>
  } @else if (creature(); as c) {
    <app-creature-book-page [creature]="c" />
  }
</app-book-reader-shell>
