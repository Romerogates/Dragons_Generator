# 1. Le videur : Redirection automatique de HTTP vers HTTPS
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name dragons-generator.top;

    # Let’s Encrypt HTTP-01 — ne pas rediriger vers un HTTPS éventuellement expiré
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. La zone sécurisée : Ton application
server {
    listen 443 ssl;
    server_name dragons-generator.top;

    # Docker DNS : après un restart API l’IP change — ne pas la figer au boot nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream dragons-api;

    # On indique à Nginx où trouver les certificats qu'on vient de générer
    ssl_certificate /etc/letsencrypt/live/dragons-generator.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragons-generator.top/privkey.pem;

    # Quelques réglages de sécurité standards
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    # PDF.js worker (module) — Chrome exige un MIME JS, pas octet-stream
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routage Angular
    location / {
        # Google Sign-In (GIS) envoie le jeton par postMessage ; same-origin bloque.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri $uri/ /index.html;
    }

    # PWA : ne pas mettre en cache long le service worker ni le manifest
    location ~* ^/(ngsw-worker\.js|ngsw\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Reverse Proxy vers l'API (HTTP + WebSocket SignalR)
    # Génération IA (aventure Groq, vies, /ai/status) : timeout long pour éviter 504.
    # Le reste de l’API reste court : un Ollama coincé ne doit pas bloquer /species.
    location ~ ^/api/(generate-|ai/) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_next_upstream off;
        error_page 502 503 504 = @api_down;
    }

    location /api/hubs/ {
        rewrite ^/api/hubs/(.*)$ /hubs/$1 break;
        proxy_pass http://$api_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
        proxy_next_upstream off;
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":"unavailable"}';
    }

    error_page 500 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
