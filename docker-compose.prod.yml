x-logging: &default-logging
  driver: json-file
  options:
    max-size: "12m"
    max-file: "3"

services:
  ollama:
    container_name: dragons-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Un seul modèle, une inférence à la fois, décharge après 5 min d’inactivité.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - dragons-network
    # Limite cgroup réelle (deploy.resources est ignoré hors Swarm).
    mem_limit: 2800m
    memswap_limit: 2800m
    cpus: "2.0"
    oom_score_adj: 400
    logging: *default-logging
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  dragons-api:
    container_name: dragons-api
    restart: unless-stopped
    build:
      context: ./DragonsGenerator.API
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      RateLimit__Enabled: "true"
      ConnectionStrings__Default: "Data Source=/app/data/dragons.db"
      App__PublicWebUrl: https://dragons-generator.top
      Groq__AdventureModel: groq/compound
      Groq__FallbackModel: llama-3.3-70b-versatile
      Groq__MaxAttempts: "3"
      Groq__MaxRetryWindowMs: "60000"
      # Ollama d’abord (budget court), puis Groq — l’API ne dépend pas du process Ollama.
      LocalLlm__Enabled: "true"
      LocalLlm__BaseUrl: http://ollama:11434/v1
      LocalLlm__Model: qwen2.5:3b
      LocalLlm__MaxRetryWindowMs: "25000"
    volumes:
      - dragons-api-data:/app/data
    env_file:
      - path: .env
        required: false
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: "1.5"
    oom_score_adj: -300
    logging: *default-logging
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - dragons-network

  dragons-web:
    container_name: dragons-web
    restart: unless-stopped
    build:
      context: ./DragonsGenerator.WEB
      dockerfile: Dockerfile
      args:
        APP_BUILD_COUNT: ${APP_BUILD_COUNT:-0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    oom_score_adj: -200
    logging: *default-logging
    labels:
      autoheal: "true"
    depends_on:
      - dragons-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dragons-network

  autoheal:
    container_name: dragons-autoheal
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "20"
      AUTOHEAL_START_PERIOD: "90"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
    memswap_limit: 64m
    logging: *default-logging
    networks:
      - dragons-network

volumes:
  dragons-api-data:
  ollama-data:

networks:
  dragons-network:
    driver: bridge
