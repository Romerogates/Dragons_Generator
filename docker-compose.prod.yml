x-logging: &default-logging
  driver: json-file
  options:
    max-size: "12m"
    max-file: "3"

services:
  dragons-api:
    container_name: dragons-api
    restart: unless-stopped
    build:
      context: ./DragonsGenerator.API
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      RateLimit__Enabled: "true"
      ConnectionStrings__Default: "Data Source=/app/data/dragons.db"
      App__PublicWebUrl: https://dragons-generator.top
      Groq__AdventureModel: qwen/qwen3.8-27b
      Groq__ShortModel: qwen/qwen3.8-27b
      Groq__FallbackModel: openai/gpt-oss-20b
      Groq__MaxAttempts: "1"
      Groq__MaxRetryWindowMs: "60000"
      Gemini__BaseUrl: https://generativelanguage.googleapis.com/v1beta/openai
      Gemini__Model: gemini-3.8-flash
      Gemini__MaxAttempts: "3"
    volumes:
      - dragons-api-data:/app/data
      - ${BACKUP_HOST_DIR:-/home/debian/backups/dragons}:/app/host-backups:ro
    env_file:
      - path: .env
        required: false
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: "1.5"
    oom_score_adj: -300
    logging: *default-logging
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - dragons-network

  dragons-web:
    container_name: dragons-web
    restart: unless-stopped
    build:
      context: ./DragonsGenerator.WEB
      dockerfile: Dockerfile
      args:
        APP_BUILD_COUNT: ${APP_BUILD_COUNT:-0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    oom_score_adj: -200
    logging: *default-logging
    labels:
      autoheal: "true"
    depends_on:
      - dragons-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/nginx-health 2>/dev/null | grep -q ok || pidof nginx >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dragons-network

  autoheal:
    container_name: dragons-autoheal
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "20"
      AUTOHEAL_START_PERIOD: "90"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
    memswap_limit: 64m
    logging: *default-logging
    networks:
      - dragons-network

volumes:
  dragons-api-data:

networks:
  dragons-network:
    driver: bridge
