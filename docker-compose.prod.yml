services:
  ollama:
    container_name: dragons-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - dragons-network
    deploy:
      resources:
        limits:
          memory: 3500M
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  dragons-api:
    container_name: dragons-api
    restart: unless-stopped
    build:
      context: ./DragonsGenerator.API
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      RateLimit__Enabled: "true"
      ConnectionStrings__Default: "Data Source=/app/data/dragons.db"
      App__PublicWebUrl: https://dragons-generator.top
      LocalLlm__Enabled: "true"
      LocalLlm__BaseUrl: http://ollama:11434/v1
      LocalLlm__Model: qwen2.5:3b
    volumes:
      - dragons-api-data:/app/data
    env_file:
      - path: .env
        required: false
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - dragons-network

  dragons-web:
    container_name: dragons-web
    restart: unless-stopped
    build:
      context: ./DragonsGenerator.WEB
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - dragons-api
    networks:
      - dragons-network

volumes:
  dragons-api-data:
  ollama-data:

networks:
  dragons-network:
    driver: bridge
