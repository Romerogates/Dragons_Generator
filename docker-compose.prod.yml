services:
  dragons-api:
    container_name: dragons-api
    build:
      context: ./DragonsGenerator.API
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Data Source=/app/data/dragons.db"
      App__PublicWebUrl: https://dragons-generator.top
    volumes:
      - dragons-api-data:/app/data
    env_file:
      - path: .env
        required: false
    networks:
      - dragons-network

  dragons-web:
    container_name: dragons-web
    build:
      context: ./DragonsGenerator.WEB
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - dragons-api
    networks:
      - dragons-network

volumes:
  dragons-api-data:

networks:
  dragons-network:
    driver: bridge
