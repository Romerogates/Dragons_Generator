# CI overlay — no Docker Hub / extra ECR pulls. Reuse nginx:alpine already prefetched
# for dragons-web. E2E smoke does not send mail or call the local LLM.
services:
  mailhog:
    image: nginx:alpine
    command: ["sleep", "infinity"]

  ollama:
    image: nginx:alpine
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true

