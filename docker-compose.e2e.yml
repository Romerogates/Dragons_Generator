# CI overlay — no Docker Hub. MailHog/Ollama are only depends_on for the API.
# E2E smoke does not send mail or call the local LLM.
services:
  mailhog:
    image: busybox:1.36
    command: ["sleep", "infinity"]

  ollama:
    image: busybox:1.36
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true
