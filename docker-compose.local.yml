# Stack locale de test — ports alternatifs
# Frontend : http://localhost:8081
# API      : http://localhost:8080  (Swagger : /swagger)
# MailHog  : http://localhost:8025  (boîte mail de test)
#
# Admin par défaut : admin@dragons.local / AdminDragons!2026

services:
  mailhog:
    container_name: dragons-mailhog-local
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - dragons-network

  ollama:
    container_name: dragons-ollama-local
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - dragons-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  dragons-api:
    container_name: dragons-api-local
    build:
      context: ./DragonsGenerator.API
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Data Source=/app/data/dragons.db"
      # SMTP local : MailHog forcé (ne pas hériter du .env prod OVH)
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Smtp__UseSsl: "false"
      Smtp__UserName: ""
      Smtp__Password: ""
      Smtp__FromEmail: noreply@dragons-generator.local
      Smtp__FromName: Dragons Generator
      App__PublicWebUrl: http://localhost:8081
      Groq__Model: groq/compound
      Groq__AdventureModel: qwen/qwen3.6-27b
      LocalLlm__Enabled: "true"
      LocalLlm__BaseUrl: http://ollama:11434/v1
      LocalLlm__Model: qwen2.5:3b
      RateLimit__Enabled: "false"
      Jwt__Key: DragonsGenerator_Dev_Jwt_Key_ChangeInProd_32+
      Admin__Email: admin@dragons.local
      Admin__Password: AdminDragons!2026
      # Comptes de test auto-créés (Development uniquement, email confirmé)
      DevSeed__Enabled: "true"
      DevSeed__Users__0__Email: anthony.martinr@hotmail.be
      DevSeed__Users__0__Password: Ma3ds3ds
      DevSeed__Users__0__DisplayName: Anthony
      DevSeed__Users__1__Email: test@dragons.local
      DevSeed__Users__1__Password: TestDragons!2026
      DevSeed__Users__1__DisplayName: TestHero
    volumes:
      - dragons-api-data:/app/data
    env_file:
      - path: .env
        required: false
    depends_on:
      mailhog:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - dragons-network

  dragons-web:
    container_name: dragons-web-local
    build:
      context: ./DragonsGenerator.WEB
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.local.conf
    ports:
      - "8081:80"
    depends_on:
      - dragons-api
    networks:
      - dragons-network

volumes:
  dragons-api-data:
  ollama-data:

networks:
  dragons-network:
    driver: bridge
